<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A clean, functional digital calculator.">
    <title>Calculator | FocusFlow</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="app-container" id="app-container">
        
        <!-- Calculator Panel -->
        <main class="calculator">
            <header class="calc-header">
                <div class="logo">
                    <span class="logo-mark">C</span>
                    <span class="logo-text">Calculator</span>
                </div>
                <button id="toggle-history" class="history-toggle-btn">
                    <span id="history-btn-text">History</span>
                </button>
            </header>

            <div class="display-screen">
                <div class="expression" id="expression" aria-live="polite"></div>
                <div class="result" id="result" aria-live="polite">0</div>
            </div>

            <div class="keypad">
                <button class="key key-accent" data-action="clear">AC</button>
                <button class="key key-accent" data-action="delete">DEL</button>
                <button class="key key-operator" data-action="percent">%</button>
                <button class="key key-operator" data-action="divide">÷</button>

                <button class="key" data-number="7">7</button>
                <button class="key" data-number="8">8</button>
                <button class="key" data-number="9">9</button>
                <button class="key key-operator" data-action="multiply">×</button>

                <button class="key" data-number="4">4</button>
                <button class="key" data-number="5">5</button>
                <button class="key" data-number="6">6</button>
                <button class="key key-operator" data-action="subtract">−</button>

                <button class="key" data-number="1">1</button>
                <button class="key" data-number="2">2</button>
                <button class="key" data-number="3">3</button>
                <button class="key key-operator" data-action="add">+</button>

                <button class="key key-span-2" data-number="0">0</button>
                <button class="key" data-action="decimal">.</button>
                <button class="key key-equals" data-action="calculate">=</button>
            </div>
        </main>

        <!-- Side Drawer (History) -->
        <aside class="history-drawer" id="history-drawer">
            <header class="history-header">
                <h2>History</h2>
                <button id="clear-history" class="clear-history-btn">Clear</button>
            </header>
            <ul class="history-list" id="history-list">
                <li class="history-empty">No calculations yet.</li>
            </ul>
        </aside>

    </div>

    <script src="js/calculator.js"></script>
</body>
</html>

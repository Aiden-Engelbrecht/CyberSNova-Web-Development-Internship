<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse Domains | CyberSNova</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .search-bar { width: 100%; max-width: 600px; margin-bottom: 3rem; }
        .search-bar input {
            width: 100%; padding: 1.25rem 1.5rem; font-family: var(--font-sans); font-size: 1.1rem;
            border: 2px solid var(--ink); border-radius: var(--radius-sm); background: var(--surface);
            outline: none; transition: all 0.2s;
        }
        .search-bar input:focus { border-color: var(--accent); box-shadow: 0 4px 0 var(--accent); }

        .domain-list { display: flex; flex-direction: column; gap: 1.5rem; }
        
        .domain-row {
            display: grid; grid-template-columns: 80px 1fr auto; gap: 2rem; align-items: center;
            background: var(--surface); border: 1px solid var(--ink); border-radius: var(--radius-sm);
            padding: 2rem; text-decoration: none; color: var(--ink); transition: all 0.2s ease;
            position: relative; overflow: hidden;
        }
        .domain-row:hover { transform: translateY(-4px); box-shadow: 0 12px 24px rgba(0,0,0,0.08); }
        
        /* Distinct top border colors for each domain */
        .domain-row[data-domain="web-development"] { border-top: 6px solid #2563eb; }
        .domain-row[data-domain="data-science"] { border-top: 6px solid #16a34a; }
        .domain-row[data-domain="cybersecurity"] { border-top: 6px solid #dc2626; }
        .domain-row[data-domain="ui-ux-design"] { border-top: 6px solid #9333ea; }
        .domain-row[data-domain="cloud-computing"] { border-top: 6px solid #0ea5e9; }

        .domain-icon-box {
            width: 80px; height: 80px; display: grid; place-items: center; font-size: 2.5rem;
            background: var(--paper); border-radius: var(--radius-sm); border: 1px solid var(--line);
        }
        .domain-info h3 { font-size: 1.75rem; margin-bottom: 0.5rem; }
        .domain-info p { color: var(--ink-soft); font-size: 1rem; max-width: 500px; }
        
        .domain-action { text-align: right; }
        .domain-tag { display: inline-block; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; color: var(--ink-muted); margin-bottom: 0.5rem; letter-spacing: 0.05em; }
        
        @media (max-width: 768px) {
            .domain-row { grid-template-columns: 1fr; gap: 1rem; padding: 1.5rem; }
            .domain-icon-box { width: 60px; height: 60px; font-size: 1.75rem; }
            .domain-action { text-align: left; margin-top: 1rem; }
        }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="container nav-container">
            <a href="index.html" class="logo"><span class="logo-mark">C</span> CyberSNova</a>
            <button class="menu-toggle" aria-label="Toggle menu">Menu</button>
            <nav class="nav-links">
                <a href="index.html">Home</a>
                <a href="domains.html">Domains</a>
                <a href="tasks.html">Tasks</a>
                <a href="guidelines.html">Guidelines</a>
                <a href="register.html" class="btn btn-primary" style="padding: 0.5rem 1rem;">Register</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="container">
            <div class="page-header">
                <p class="eyebrow">Find your specialty</p>
                <h1>Available Domains.</h1>
                <p class="text-soft">Select a domain to view its specific project requirements and tech stack.</p>
            </div>

            <div class="search-bar">
                <input type="text" id="domain-search" placeholder="Search domains (e.g., Web, Data)...">
            </div>

            <div class="domain-list" id="domain-grid">
                <!-- Rendered via JS -->
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2026 CyberSNova.</p>
                <p>Internship Portal Project</p>
            </div>
        </div>
    </footer>

    <script src="js/main.js"></script>
    <script src="js/domains.js"></script>
</body>
</html>
